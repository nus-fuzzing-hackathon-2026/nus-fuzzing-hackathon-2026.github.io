<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.2">
    <title>Fuzzing Competition</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <ul class="nav justify-content-center">
            <li class="nav-item">
                <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
            </li>
            <li class="nav-item">
            </li>
        </ul>
    </nav>
    <div class="d-flex justify-content-center align-items-center vh-10 flex-column">
        <main>
            <br>
            <h1>Fuzzing Competition: Summer School 2026</h1>
            <br>
            <h4 class="text-muted" style="font-size: 1rem;">Only the latest submission per team is shown. Results are typically available ~20 minutes after submission. Submissions close to the deadline may take longer.</h4>
            <div class="container mt-5">
                <h2 class="mb-4">Leaderboard</h2>
                <table class="table table-bordered table-striped table-hover" id="leaderboardTable">
                    <thead class="thead-dark">
                        <tr>
                            <th scope="col">Rank</th>
                            <th scope="col">Team</th>
                            <th scope="col">Score</th>
                            <th scope="col">Parser</th>
                            <th scope="col">SQL Logic</th>
                            <th scope="col">Stateful</th>
                        </tr>
                    </thead>
                    <tbody id="student_fuzzer_records">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</body>
<script>
    const leaderboardTable = $('#leaderboardTable').DataTable({
        "order": [[2, 'desc']],
        "lengthMenu": [25, 50, 75, 100],
        "pageLength": 30,
        "searching": false,
        "ordering": true,
        "paging": false,
        "info": false,
        "columns": [
            {
                "data": null,
                "render": function (data, type, row, meta) {
                    return meta.row + meta.settings._iDisplayStart + 1;
                }
            },
            { "data": "team", "className": "text-center" },
            { "data": "score", "className": "text-center" },
            { "data": "basic", "className": "text-center" },
            { "data": "medium", "className": "text-center" },
            { "data": "advanced", "className": "text-center" }
        ]
    });

    const JSON_URL = "./eval_summary.json";
    function sumOfLargestTwo(a, b, c) {
        return a + b + c - Math.min(a, b, c);
    }

    async function fetchAndRenderData() {
        try {
            const response = await fetch(JSON_URL);
            const data = await response.json();
            const rowData = Object.entries(data).map(([submissionId, [score, n_basic, n_medium, n_advanced]]) => ({
                "team": submissionId.replace(/^hackathon-/, ''),
                "score": sumOfLargestTwo(n_basic, n_medium, n_advanced),
                "basic": n_basic,
                "medium": n_medium,
                "advanced": n_advanced
            }));
            leaderboardTable.rows.add(rowData).draw();
        } catch (error) {
            console.error("Error fetching or rendering data:", error);
        }
    }

    fetchAndRenderData();

    leaderboardTable.on('draw', function () {
        leaderboardTable.rows({ order: 'current' }).every(function (rowIdx) {
            var rowNode = this.node();
            var rank = rowIdx + 1;
            var $rankCell = $(rowNode).find('td:first');
            if (rank <= 2) {
                $rankCell.html('<span style="font-size: 28px;">&#127942;</span> ' + rank);
            } else {
                $rankCell.html('<span style="font-size: 28px; visibility: hidden;">&#127942;</span> ' + rank);
            }
        });
    });
</script>
</html>
